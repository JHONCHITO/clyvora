name: Clyvora checks

on:
  pull_request:
  push:
    branches:
      - feat/jhon-agent-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clyvora-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile application
        run: npm run build
      - name: Check TypeScript
        run: npm run lint
